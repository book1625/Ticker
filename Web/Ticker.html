<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ticker 節拍計時器</title>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --primary: #bb86fc;
    --on-primary: #000;
    --secondary: #333;
    --on-secondary: #e0e0e0;
    --text: #e6e6e6;
    --muted: #9e9e9e;
    --dot: #4caf50;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 24px;
    min-height: 100%;
  }

  /* 顯示區 */
  .display { text-align: center; }

  .bpm-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: transparent;
    transition: background 60ms;
  }
  .dot.active { background: var(--dot); }

  .bpm-number {
    font-size: 80px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .bpm-label {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 4px;
  }

  .time-number {
    font-size: 64px;
    font-weight: 700;
    margin-top: 16px;
    font-variant-numeric: tabular-nums;
  }

  /* 選擇區 */
  .selection {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid #444;
    border-radius: 8px;
    color: var(--text);
    font-size: 20px;
    padding: 12px 14px;
    outline: none;
  }
  .field input:focus { border-color: var(--primary); }
  .field input:disabled { opacity: 0.5; }

  .field input[type="range"] {
    background: transparent;
    border: none;
    padding: 0;
    accent-color: var(--primary);
    cursor: pointer;
  }

  .chips {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }

  .chip {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid #444;
    border-radius: 999px;
    color: var(--on-secondary);
    font-size: 15px;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none;
  }
  .chip.selected {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary);
  }
  .chip:disabled { opacity: 0.5; cursor: default; }

  /* 按鍵區 */
  .buttons {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 420px;
    justify-content: center;
  }

  .btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: none;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    color: var(--on-primary);
    background: var(--primary);
  }
  .btn.reset {
    background: var(--secondary);
    color: var(--on-secondary);
  }
  .btn:active { transform: scale(0.96); }

  /* 橫向排版 */
  @media (orientation: landscape) and (max-height: 520px) {
    body { flex-direction: row; gap: 40px; }
    .selection { max-width: 300px; }
    .buttons { flex-direction: column; width: auto; }
    .bpm-number { font-size: 64px; }
    .time-number { font-size: 52px; }
  }
</style>
</head>
<body>
  <div class="display">
    <div class="bpm-row">
      <div class="dot" id="dotLeft"></div>
      <div class="bpm-number" id="bpmDisplay">120</div>
      <div class="dot" id="dotRight"></div>
    </div>
    <div class="bpm-label">BPM</div>
    <div class="time-number" id="timeDisplay">15:00</div>
  </div>

  <div class="selection">
    <div class="field">
      <label for="bpmInput">節拍 (BPM)</label>
      <input id="bpmInput" type="text" inputmode="numeric" value="120" maxlength="3">
      <div class="chips" id="bpmChips"></div>
    </div>
    <div class="field">
      <label for="minInput">倒數分鐘數</label>
      <input id="minInput" type="text" inputmode="numeric" value="15" maxlength="3">
      <div class="chips" id="minChips"></div>
    </div>
    <div class="field">
      <label for="volInput">音量 <span id="volValue">100%</span></label>
      <input id="volInput" type="range" min="0" max="100" value="100">
    </div>
  </div>

  <div class="buttons">
    <button class="btn reset" id="resetBtn">重置</button>
    <button class="btn" id="toggleBtn">開始</button>
  </div>

  <!-- iOS 靜音開關解鎖：播放內嵌無聲音檔，將音訊工作階段切為 Playback，使 Web Audio 不受靜音開關影響 -->
  <audio id="silentUnlock" loop playsinline preload="auto"
    src="data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA=="></audio>

<script>
(function () {
  "use strict";

  const BPM_PRESETS = [160, 180, 200, 210, 220];
  const MIN_PRESETS = [15, 20, 25, 30, 35, 40];
  const CHIME_INTERVAL_MS = 5 * 60 * 1000;

  const bpmInput = document.getElementById("bpmInput");
  const minInput = document.getElementById("minInput");
  const bpmDisplay = document.getElementById("bpmDisplay");
  const timeDisplay = document.getElementById("timeDisplay");
  const dotLeft = document.getElementById("dotLeft");
  const dotRight = document.getElementById("dotRight");
  const toggleBtn = document.getElementById("toggleBtn");
  const resetBtn = document.getElementById("resetBtn");
  const volInput = document.getElementById("volInput");
  const volValue = document.getElementById("volValue");

  // ---- 狀態 ----
  let audioCtx = null;
  let masterGain = null;
  let volume = 1;
  let wakeLock = null;
  let isRunning = false;
  let isPaused = false;
  let bpm = 120;
  let totalDurationMs = 15 * 60 * 1000;
  let remainingMs = totalDurationMs;

  // 排程用（皆以 AudioContext 時間為基準，避免長時間漂移）
  let schedulerTimer = null;
  let uiTimer = null;
  let nextBeatTime = 0;      // 下一拍的 audio 時間（秒）
  let beatIndex = 0;         // 累計拍數，偶數 ti、奇數 ta
  let startAudioTime = 0;    // 本段起始 audio 時間（秒）
  let nextChimeMs = CHIME_INTERVAL_MS;

  const LOOKAHEAD_MS = 25;   // 排程輪詢間隔
  const SCHEDULE_AHEAD = 0.1; // 預先排程秒數

  // ---- 聲音合成 ----
  const silentUnlock = document.getElementById("silentUnlock");

  function ensureCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = volume;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();

    // iPhone 靜音開關會壓掉 Web Audio；於使用者手勢中播放無聲音檔可切換音訊類別繞過
    const p = silentUnlock.play();
    if (p) p.catch(function () {});
  }

  // 木魚敲擊聲：起音音高快速下滑到基頻 + 極快衰減，加不諧和高泛音與極短高頻觸點，形成中空的「喀」
  function playClick(freq, atTime) {
    // 起音觸點：極短高通噪音，給敲擊的「喀」瞬態
    const tickDur = 0.006;
    const frames = Math.floor(audioCtx.sampleRate * tickDur);
    const buf = audioCtx.createBuffer(1, frames, audioCtx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) ch[i] = Math.random() * 2 - 1;
    const tick = audioCtx.createBufferSource();
    tick.buffer = buf;
    const hp = audioCtx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 2200;
    const tGain = audioCtx.createGain();
    tGain.gain.setValueAtTime(0.15, atTime);
    tGain.gain.exponentialRampToValueAtTime(0.0001, atTime + tickDur);
    tick.connect(hp).connect(tGain).connect(masterGain);
    tick.start(atTime);
    tick.stop(atTime + tickDur);

    // 主體：音高由高快速滑回基頻，極快指數衰減，形成木魚中空敲擊
    const bodyDur = 0.05;
    const osc = audioCtx.createOscillator();
    const oGain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq * 1.6, atTime);
    osc.frequency.exponentialRampToValueAtTime(freq, atTime + 0.01);
    oGain.gain.setValueAtTime(0.9, atTime);
    oGain.gain.exponentialRampToValueAtTime(0.0001, atTime + bodyDur);
    osc.connect(oGain).connect(masterGain);
    osc.start(atTime);
    osc.stop(atTime + bodyDur);

    // 不諧和高泛音：更快衰減，增添木魚的中空音色
    const osc2 = audioCtx.createOscillator();
    const o2Gain = audioCtx.createGain();
    osc2.type = "sine";
    osc2.frequency.value = freq * 2.6;
    o2Gain.gain.setValueAtTime(0.14, atTime);
    o2Gain.gain.exponentialRampToValueAtTime(0.0001, atTime + 0.025);
    osc2.connect(o2Gain).connect(masterGain);
    osc2.start(atTime);
    osc2.stop(atTime + 0.025);
  }

  // 叮聲：基頻加 3 倍泛音、指數衰減長尾韻，與拍點聲區隔
  function playChime(atTime) {
    const dur = 1.5, attack = 0.005, base = 2000;
    const gain = audioCtx.createGain();
    const g = gain.gain;
    g.setValueAtTime(0, atTime);
    g.linearRampToValueAtTime(1, atTime + attack);
    g.exponentialRampToValueAtTime(0.0001, atTime + dur);
    gain.connect(masterGain);
    [[base, 0.7], [base * 3, 0.3]].forEach(function (pair) {
      const osc = audioCtx.createOscillator();
      const og = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = pair[0];
      og.gain.value = pair[1];
      osc.connect(og).connect(gain);
      osc.start(atTime);
      osc.stop(atTime + dur);
    });
  }

  // ---- 排程迴圈 ----
  function scheduler() {
    const interval = 60 / bpm; // 每拍秒數
    while (nextBeatTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
      const isTi = beatIndex % 2 === 0;

      // 到達間隔時間的那一拍，改以長音叮聲取代 ti-ta 拍點聲
      const elapsedMs = (nextBeatTime - startAudioTime) * 1000;
      if (elapsedMs >= nextChimeMs) {
        playChime(nextBeatTime);
        nextChimeMs += CHIME_INTERVAL_MS;
      } else {
        playClick(isTi ? 1500 : 900, nextBeatTime);
      }
      scheduleDotFlash(nextBeatTime, isTi);

      beatIndex++;
      nextBeatTime += interval;
    }
  }

  // 指示燈依 audio 時間對齊亮起
  function scheduleDotFlash(atTime, isTi) {
    const delayMs = Math.max(0, (atTime - audioCtx.currentTime) * 1000);
    setTimeout(function () {
      const dot = isTi ? dotLeft : dotRight;
      const other = isTi ? dotRight : dotLeft;
      dot.classList.add("active");
      other.classList.remove("active");
      setTimeout(function () { dot.classList.remove("active"); }, 120);
    }, delayMs);
  }

  // ---- 倒計時 UI ----
  function tickUi() {
    const elapsedMs = (audioCtx.currentTime - startAudioTime) * 1000;
    const remaining = totalDurationMs - elapsedMs;
    if (remaining <= 0) {
      remainingMs = 0;
      updateTimeDisplay(0);
      finish();
      return;
    }
    remainingMs = remaining;
    updateTimeDisplay(remaining);
  }

  function finish() {
    stopScheduling();
    isRunning = false;
    isPaused = false;
    playEndChimes();
    setFieldsEnabled(true);
    toggleBtn.textContent = "開始";
    remainingMs = totalDurationMs;
    setTimeout(function () { if (!isRunning) updateTimeDisplay(totalDurationMs); }, 2200);
  }

  // 結束連播三聲叮，間隔略長於叮聲長度
  function playEndChimes() {
    let t = audioCtx.currentTime + 0.05;
    for (let i = 0; i < 3; i++) {
      playChime(t);
      t += 0.6;
    }
  }

  // ---- 顯示 ----
  function updateTimeDisplay(ms) {
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    timeDisplay.textContent =
      String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function clearDots() {
    dotLeft.classList.remove("active");
    dotRight.classList.remove("active");
  }

  // ---- 控制 ----
  function start() {
    ensureCtx();
    bpm = clamp(parseInt(bpmInput.value, 10) || 120, 30, 240);
    bpmDisplay.textContent = bpm;

    if (isPaused) {
      totalDurationMs = remainingMs;
    } else {
      const mins = clamp(parseInt(minInput.value, 10) || 15, 1, 180);
      totalDurationMs = mins * 60 * 1000;
    }

    startAudioTime = audioCtx.currentTime + 0.1;
    nextBeatTime = startAudioTime;
    beatIndex = 0;
    nextChimeMs = CHIME_INTERVAL_MS;

    isRunning = true;
    isPaused = false;
    setFieldsEnabled(false);
    toggleBtn.textContent = "暫停";
    requestWakeLock();

    schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);
    uiTimer = setInterval(tickUi, 200);
    scheduler();
  }

  function pause() {
    // 記錄剩餘時間，下次自暫停點續跑
    const elapsedMs = (audioCtx.currentTime - startAudioTime) * 1000;
    remainingMs = Math.max(0, totalDurationMs - elapsedMs);
    stopScheduling();
    isRunning = false;
    isPaused = true;
    setFieldsEnabled(false);
    toggleBtn.textContent = "開始";
    updateTimeDisplay(remainingMs);
  }

  function reset() {
    stopScheduling();
    isRunning = false;
    isPaused = false;
    const mins = clamp(parseInt(minInput.value, 10) || 15, 1, 180);
    totalDurationMs = mins * 60 * 1000;
    remainingMs = totalDurationMs;
    setFieldsEnabled(true);
    toggleBtn.textContent = "開始";
    updateTimeDisplay(totalDurationMs);
  }

  function stopScheduling() {
    if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
    if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
    releaseWakeLock();
    clearDots();
  }

  // 螢幕 Wake Lock：計時期間保持螢幕常亮，避免自動休眠導致計時器凍結、聲音中斷
  function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
    }).catch(function () {});
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }

  function setFieldsEnabled(enabled) {
    bpmInput.disabled = !enabled;
    minInput.disabled = !enabled;
    document.querySelectorAll(".chip").forEach(function (c) { c.disabled = !enabled; });
  }

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  // ---- 設定記憶（localStorage）----
  const STORAGE_KEY = "tickerSettings";

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        bpm: bpmInput.value,
        min: minInput.value,
        volume: volInput.value
      }));
    } catch (e) {}
  }

  function loadSettings() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
    if (!s) return;
    if (s.bpm) {
      bpmInput.value = s.bpm;
      bpmDisplay.textContent = s.bpm;
    }
    if (s.min) {
      minInput.value = s.min;
      totalDurationMs = clamp(parseInt(s.min, 10) || 15, 1, 180) * 60 * 1000;
      remainingMs = totalDurationMs;
    }
    if (s.volume != null && s.volume !== "") {
      volInput.value = s.volume;
      volume = clamp(parseInt(s.volume, 10) || 0, 0, 100) / 100;
      volValue.textContent = Math.round(volume * 100) + "%";
    }
  }

  // ---- 事件 ----
  toggleBtn.addEventListener("click", function () {
    if (isRunning) pause(); else start();
  });
  resetBtn.addEventListener("click", reset);

  // 音量：直接調整 master gain，播放中也即時生效
  volInput.addEventListener("input", function () {
    volume = clamp(parseInt(volInput.value, 10) || 0, 0, 100) / 100;
    volValue.textContent = Math.round(volume * 100) + "%";
    if (masterGain) masterGain.gain.value = volume;
    saveSettings();
  });

  // 頁面隱藏時系統會自動釋放 Wake Lock，切回可見且仍在計時則重新取得，並喚醒可能被掛起的音訊
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && isRunning) {
      requestWakeLock();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }
  });

  bpmInput.addEventListener("input", function () {
    bpmInput.value = bpmInput.value.replace(/\D/g, "").slice(0, 3);
    if (!isRunning && !isPaused) {
      bpmDisplay.textContent = bpmInput.value || "0";
      syncChips();
    }
    saveSettings();
  });

  minInput.addEventListener("input", function () {
    minInput.value = minInput.value.replace(/\D/g, "").slice(0, 3);
    if (!isRunning && !isPaused) {
      const mins = parseInt(minInput.value, 10) || 0;
      updateTimeDisplay(mins * 60 * 1000);
      syncChips();
    }
    saveSettings();
  });

  // ---- 快選 chips ----
  function buildChips(container, presets, input, onPick) {
    presets.forEach(function (p) {
      const el = document.createElement("button");
      el.className = "chip";
      el.textContent = p;
      el.dataset.value = p;
      el.addEventListener("click", function () {
        if (input.disabled) return;
        input.value = p;
        onPick();
        syncChips();
        saveSettings();
      });
      container.appendChild(el);
    });
  }

  function syncChips() {
    document.querySelectorAll("#bpmChips .chip").forEach(function (c) {
      c.classList.toggle("selected", c.dataset.value === bpmInput.value);
    });
    document.querySelectorAll("#minChips .chip").forEach(function (c) {
      c.classList.toggle("selected", c.dataset.value === minInput.value);
    });
  }

  buildChips(document.getElementById("bpmChips"), BPM_PRESETS, bpmInput, function () {
    bpmDisplay.textContent = bpmInput.value || "0";
  });
  buildChips(document.getElementById("minChips"), MIN_PRESETS, minInput, function () {
    const mins = parseInt(minInput.value, 10) || 0;
    updateTimeDisplay(mins * 60 * 1000);
  });

  // ---- 初始 ----
  loadSettings();
  updateTimeDisplay(totalDurationMs);
  syncChips();
})();
</script>
</body>
</html>
